name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    env:
      BUNDLE_GEMFILE: ${{ matrix.gemfile }}
      LC_ALL: C
    strategy:
      fail-fast: false
      matrix:
        ruby-version: ["3.2", "3.4"]
        rails-line: ["7.0", "7.1", "7.2", "8.0", "8.1"]
        include:
          - rails-line: "7.0"
            gemfile: gemfiles/rails_7_0.gemfile
          - rails-line: "7.1"
            gemfile: gemfiles/rails_7_1.gemfile
          - rails-line: "7.2"
            gemfile: gemfiles/rails_7_2.gemfile
          - rails-line: "8.0"
            gemfile: gemfiles/rails_8_0.gemfile
          - rails-line: "8.1"
            gemfile: gemfiles/rails_8_1.gemfile
    steps:
      - uses: actions/checkout@v7

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler: default
          bundler-cache: true

      - name: Validate gemspec
        # Rails dependencies intentionally have no upper bound; older RubyGems warns.
        run: gem build app-url-rails.gemspec

      - name: Smoke test
        run: bundle exec ruby -Ilib -e "require 'app_url'; puts AppUrl::VERSION"

      - name: Tests
        run: bundle exec rake test
