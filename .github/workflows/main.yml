name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.3"
          bundler-cache: true

      - name: Validate gemspec
        run: gem build app-url-rails.gemspec --strict

      - name: Smoke test
        run: bundle exec ruby -Ilib -e "require 'app_url'; puts AppUrl::VERSION"

      - name: Tests
        run: bundle exec rake test
